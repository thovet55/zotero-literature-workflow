[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zotero-literature-workflow"
version = "0.1.0"
description = "Read-only Zotero Web API tools for OpenCode literature review"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/thovet55/zotero-literature-workflow"
Repository = "https://github.com/thovet55/zotero-literature-workflow"
Issues = "https://github.com/thovet55/zotero-literature-workflow/issues"

[project.optional-dependencies]
mcp = ["mcp>=1.0,<2.0"]
pdf = ["pypdf>=5.0", "pymupdf>=1.24"]
dev = ["pytest>=8.0"]

[project.scripts]
zotero-workflow = "zotero_workflow.cli:main"
zotero-workflow-mcp = "zotero_workflow.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]
